[package]
name = "prelude"
version = "0.6.0"
edition = "2021"
description = "A general launcher in the terminal, with an agent control plane"
license = "Apache-2.0"
repository = "https://github.com/mikewang817/Prelude"
readme = "README.md"
keywords = ["launcher", "fzf", "cli", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "prelude"
path = "src/main.rs"

[dependencies]
# Deliberately few: every crate is startup cost, and startup latency is the
# entire point of this rewrite.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
